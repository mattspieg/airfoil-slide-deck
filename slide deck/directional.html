<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>Slide Deck Directional</title>

		<link
			href="https://cdn.prod.website-files.com/61bacad64fa3d3896a3d7a01/63184291d8d8886792d26613_Airfoil%20Favicon.png"
			rel="apple-touch-icon"
		/>
		<link
			href="https://cdn.prod.website-files.com/61bacad64fa3d3896a3d7a01/6318426d8e85c83957122077_Airfoil%20Favicon%20(1)-5%20(dragged).png"
			rel="shortcut icon"
			type="image/x-icon"
		/>

		<script>
			(() => {
				const params = new URLSearchParams(window.location.search);
				window.__AIRFOIL_LAYOUT_DEBUG__ = params.get('debugLayout') === '1';

				if (params.get('debugVite') === '1') {
					return;
				}

				const originalDebug = console.debug?.bind(console);
				if (!originalDebug) {
					return;
				}

				console.debug = (...args) => {
					if (
						typeof args[0] === 'string' &&
						(args[0] === '[vite] connecting...' || args[0] === '[vite] connected.')
					) {
						return;
					}

					originalDebug(...args);
				};
			})();
		</script>

		<link rel="stylesheet" href="../dist/reset.css" />
		<link rel="stylesheet" href="../dist/reveal.css" />
		<link rel="stylesheet" href="../dist/theme/black.css" />

		<style>
			:root {
				--r-link-color: #ffffff;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: #191919;
			}

			.reveal {
				width: 100%;
				height: 100%;
				background: #191919;
			}

			.reveal::after {
				content: "";
				position: fixed;
				right: 0;
				bottom: 0;
				width: 192px;
				height: 192px;
				pointer-events: none;
				z-index: 19;
				background: radial-gradient(
					circle farthest-side at 100% 100%,
					rgba(0, 0, 0, 0.5) 0%,
					rgba(0, 0, 0, 0.26) 48%,
					rgba(0, 0, 0, 0.12) 72%,
					rgba(0, 0, 0, 0) 100%
				);
			}

			.reveal[data-mobile-deck='true']::after {
				display: none;
			}

			.reveal[data-touch-device='true']::after {
				display: none;
			}

			.reveal.overview:not([data-dual-mode='true']) {
				touch-action: none;
			}

			.reveal .slides {
				width: 100%;
				height: 100%;
			}

			.reveal.overview:not(.overview-activating) .slides {
				transition: transform 260ms cubic-bezier(0.22, 0.61, 0.36, 1);
				will-change: transform;
			}

			.reveal.overview:not(.overview-activating) .backgrounds {
				transition: transform 260ms cubic-bezier(0.22, 0.61, 0.36, 1);
				will-change: transform;
			}

			.reveal.overview:not(.overview-activating) .slides section,
			.reveal.overview:not(.overview-activating) .backgrounds .slide-background {
				transition:
					transform 260ms cubic-bezier(0.22, 0.61, 0.36, 1),
					outline-color 180ms ease,
					outline-offset 180ms ease,
					opacity 180ms ease,
					box-shadow 180ms ease;
			}

			.reveal.overview .slides section,
			.reveal.overview .backgrounds .slide-background {
				transition:
					outline-color 180ms ease,
					outline-offset 180ms ease,
					opacity 180ms ease,
					box-shadow 180ms ease;
			}

			.reveal .backgrounds {
				position: absolute;
				width: 100%;
				height: 100%;
				top: 0;
				left: 0;
				perspective: 600px;
			}

			.reveal .slides section {
				display: flex;
				align-items: center;
				justify-content: center;
				background: #000;
			}

			.reveal .slides > section.stack {
				padding-top: 0;
				padding-bottom: 0;
				pointer-events: none;
				height: 100%;
			}

			.reveal.overview .slides > section.stack {
				padding: 0;
				top: 0 !important;
				background: none;
				outline: none;
				overflow: visible;
			}

			.reveal img,
			.reveal video,
			.reveal iframe {
				max-width: none;
				max-height: none;
				margin: 0;
			}

			.slide-image {
				display: block;
				width: 100%;
				height: 100%;
				border: 0;
				box-shadow: none;
				object-fit: contain;
				background: #000;
			}

			@keyframes bump-left {
				0%,
				100% {
					transform: none;
				}
				50% {
					transform: translateX(-4px);
				}
			}

			@keyframes bump-right {
				0%,
				100% {
					transform: none;
				}
				50% {
					transform: translateX(4px);
				}
			}

			@keyframes bump-up {
				0%,
				100% {
					transform: none;
				}
				50% {
					transform: translateY(-4px);
				}
			}

			@keyframes bump-down {
				0%,
				100% {
					transform: none;
				}
				50% {
					transform: translateY(4px);
				}
			}

			.reveal .controls .navigate-left.bump {
				animation: bump-left 180ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
			}

			.reveal .controls .navigate-right.bump {
				animation: bump-right 180ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
			}

			.reveal .controls .navigate-up.bump {
				animation: bump-up 180ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
			}

			.reveal .controls .navigate-down.bump {
				animation: bump-down 180ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
			}

			.reveal .controls .navigate-left,
			.reveal .controls .navigate-right,
			.reveal .controls .navigate-up,
			.reveal .controls .navigate-down {
				transform: none;
			}

			.reveal .controls {
				z-index: 20;
			}

			.helper-tip {
				position: fixed;
				left: 50%;
				bottom: 28px;
				z-index: 30;
				transform: translateX(-50%);
				padding: 10px 16px;
				border-radius: 999px;
				background: rgba(0, 0, 0, 0.72);
				color: rgba(255, 255, 255, 0.8);
				font-family: Arial, Helvetica, sans-serif;
				font-size: 18px;
				font-stretch: normal;
				line-height: 1;
				letter-spacing: 0.01em;
				text-align: center;
				white-space: nowrap;
				pointer-events: none;
				user-select: none;
				opacity: 0.95;
			}

			.helper-tip[hidden] {
				display: none !important;
			}

			.helper-tip__icon {
				display: inline-block;
				width: 1.15em;
				height: 1.15em;
				vertical-align: -0.18em;
				margin: 0 0.22em 0 0;
			}

			.helper-tip__icon svg {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides" id="slides"></div>
		</div>
		<div class="helper-tip" id="helper-tip" aria-live="polite" hidden></div>

			const groupStarts = [1, 2, 8, 14, 19, 24, 29, 34, 39, 44, 49, 54, 58];
			const groupSizes = groupStarts.map((start, index) => {
				const end = index + 1 < groupStarts.length ? groupStarts[index + 1] - 1 : slideCount;
				return end - start + 1;

			const groupedHashState = {
				applying: false,

			const isTouchDevice =

			const revealCanvas = {

			const allowNonPauseKeyboardInput = (event) => {
				const keyCode = event.keyCode;
				return !(

			};

			if ((isDualMode || isMobileDeck) && helperTip) {
				helperTip.hidden = true;

			if (isDualMode) {

				document.querySelector('.reveal')?.setAttribute('data-mobile-deck', 'true');
			}

			if (isTouchDevice) {
				document.querySelector('.reveal')?.setAttribute('data-touch-device', 'true');

			function createSlide(index) {
				const section = document.createElement('section');
				const image = document.createElement('img');

				image.className = 'slide-image';
				image.loading = 'lazy';
				image.decoding = 'async';
				image.src = assetPath(index);
				image.alt = `Slide ${index}`;

				section.appendChild(image);
				return section;
			}

			function toNumber(value, fallback = 0) {
				const parsed = Number(value);
				return Number.isFinite(parsed) ? parsed : fallback;
			}

			function clampIndex(value, min, max) {
				if (max < min) {
					return min;
				}

				return Math.min(max, Math.max(min, value));
			}

			function getGroupLength(groupIndex) {
				const safeGroupIndex = clampIndex(toNumber(groupIndex, 0), 0, groupSizes.length - 1);
				return groupSizes[safeGroupIndex] || 1;
			}

			function toLogicalIndices(indices = {}) {
				const physicalGroup = clampIndex(toNumber(indices.h, 0), 0, groupSizes.length - 1);
				const physicalItem = clampIndex(toNumber(indices.v, 0), 0, getGroupLength(physicalGroup) - 1);

				return {
					h: physicalItem,
					v: physicalGroup,
					f: toNumber(indices.f ?? indices.indexf, 0),
				};
			}

			function toPhysicalIndices(indices = {}) {
				const logicalGroup = clampIndex(toNumber(indices.v, 0), 0, groupSizes.length - 1);
				const logicalItem = clampIndex(toNumber(indices.h, 0), 0, getGroupLength(logicalGroup) - 1);

				return {
					h: logicalGroup,
					v: logicalItem,
					f: toNumber(indices.f ?? indices.indexf, 0),
				};
			}

			function parseGroupedDeckHash(hash, fallbackParser) {
				const match = hash?.match(/^#\/(\d+)(?:\/(\d+))?(?:\/(\d+))?$/);
				if (!match) {
					return typeof fallbackParser === 'function' ? fallbackParser(hash) : null;
				}

				const logicalGroup = clampIndex(toNumber(match[1], 1) - 1, 0, groupSizes.length - 1);
				const logicalSlide = clampIndex(toNumber(match[2] ?? 1, 1) - 1, 0, getGroupLength(logicalGroup) - 1);
				const logicalIndices = {
					h: logicalSlide,
					v: logicalGroup,
				};
				const fragmentIndex = Number.parseInt(match[3] || '', 10);
				if (Number.isFinite(fragmentIndex)) {
					logicalIndices.f = fragmentIndex;
				}

				return logicalIndices;
			}

			function serializeGroupedDeckHash(indices = {}) {
				const logicalGroup = clampIndex(toNumber(indices.v, 0), 0, groupSizes.length - 1);
				const logicalSlide = clampIndex(toNumber(indices.h, 0), 0, getGroupLength(logicalGroup) - 1);
				let hash = `/${logicalGroup + 1}/${logicalSlide + 1}`;

				if (typeof indices.f === 'number' && indices.f >= 0) {
					hash += `/${indices.f}`;
				}

				return hash;
			}

			function installGroupedHashModel() {
				const locationController = Reveal.location;
				if (!locationController || locationController.__deckGroupedHashInstalled) {
					return;
				}

				const originalGetIndicesFromHash = locationController.getIndicesFromHash.bind(locationController);
				const originalGetHash = locationController.getHash.bind(locationController);

				locationController.getIndicesFromHash = (hash = window.location.hash, options = {}) => {
					const groupedIndices = parseGroupedDeckHash(hash);
					if (groupedIndices) {
						return toPhysicalIndices(groupedIndices);
					}

					return originalGetIndicesFromHash(hash, options);
				};

				locationController.getHash = (slideElement) => {
					const activeSlide = slideElement || Reveal.getCurrentSlide?.();
					const slideId = activeSlide?.getAttribute?.('id');
					if (slideId) {
						return originalGetHash(slideElement);
					}

					const logicalIndices = getLogicalIndices(slideElement);
					if (!Reveal.getConfig().fragmentInURL) {
						delete logicalIndices.f;
					}

					return serializeGroupedDeckHash(logicalIndices);
				};

				locationController.__deckGroupedHashInstalled = true;
			}

			function parseDeckHashForRuntime(hash = window.location.hash) {
				const groupedIndices = parseGroupedDeckHash(hash);
				if (groupedIndices) {
					return groupedIndices;
				}

				const parsedIndices = Reveal.location?.getIndicesFromHash?.(hash);
				return parsedIndices ? toLogicalIndices(parsedIndices) : null;
			}

			function replaceDeckHashForRuntime(indices = getLogicalIndices()) {
				if (isDualMode || groupedHashState.applying) {
					return;
				}

				const nextHash = `#${serializeGroupedDeckHash(indices)}`;
				if (nextHash === groupedHashState.lastSerialized && window.location.hash === nextHash) {
					return;
				}

				groupedHashState.lastSerialized = nextHash;
				history.replaceState(null, '', `${window.location.pathname}${window.location.search}${nextHash}`);
			}

			function applyDeckHashForRuntime(hash = window.location.hash) {
				if (isDualMode) {
					return;
				}

				const nextIndices = parseDeckHashForRuntime(hash);
				if (!nextIndices) {
					return;
				}

				groupedHashState.applying = true;
				slideLogical(nextIndices.h, nextIndices.v, nextIndices.f || 0);
				requestAnimationFrame(() => {
					groupedHashState.applying = false;
				});
			}

			function getLogicalIndices(slideElement) {
				return slideElement ? toLogicalIndices(Reveal.getIndices(slideElement)) : toLogicalIndices(Reveal.getIndices());
			}

			function getLogicalAvailableRoutes() {
				const indices = getLogicalIndices();
				return {
					left: indices.h > 0,
					right: indices.h < getGroupLength(indices.v) - 1,
					up: indices.v > 0,
					down: indices.v < groupSizes.length - 1,
				};
			}

			function isOverviewActive() {
				return Reveal.getRevealElement().classList.contains('overview');
			}

			function slideLogical(h, v, f = 0) {
				const current = getLogicalIndices();
				const nextLogical = {
					h: typeof h === 'number' ? h : current.h,
					v: typeof v === 'number' ? v : current.v,
					f: typeof f === 'number' ? f : current.f,
				};
				const nextPhysical = toPhysicalIndices(nextLogical);

				Reveal.slide(nextPhysical.h, nextPhysical.v, nextPhysical.f);
			}

			function navigateLogical(direction) {
				const indices = getLogicalIndices();
				const overviewActive = isOverviewActive();

				if (!overviewActive) {
					logicalGroupProgress.set(indices.v, indices.h);
				}

				if (direction === 'left') {
					slideLogical(indices.h - 1, indices.v, indices.f);
				}
				else if (direction === 'right') {
					slideLogical(indices.h + 1, indices.v, indices.f);
				}
				else if (direction === 'up') {
					const targetGroup = indices.v - 1;
					const targetSlide = overviewActive
						? indices.h
						: logicalGroupProgress.has(targetGroup) ? logicalGroupProgress.get(targetGroup) : 0;
					slideLogical(targetSlide, targetGroup, indices.f);
				}
				else if (direction === 'down') {
					const targetGroup = indices.v + 1;
					const targetSlide = overviewActive
						? indices.h
						: logicalGroupProgress.has(targetGroup) ? logicalGroupProgress.get(targetGroup) : 0;
					slideLogical(targetSlide, targetGroup, indices.f);
				}
			}

			const mobileSwipeState = {
				startX: 0,
				startY: 0,
				active: false,
				navigated: false,
			};

			function measureViewportUnit(unit) {
				const probe = document.createElement('div');
				probe.style.position = 'fixed';
				probe.style.left = '0';
				probe.style.top = '0';
				probe.style.width = '1px';
				probe.style.height = `100${unit}`;
				probe.style.pointerEvents = 'none';
				probe.style.opacity = '0';
				document.body.appendChild(probe);
				const height = probe.getBoundingClientRect().height;
				probe.remove();
				return height;
			}

			function logDirectionalLayoutMetrics(reason) {
				if (!window.__AIRFOIL_LAYOUT_DEBUG__) {
					return;
				}

				const html = document.documentElement;
				const body = document.body;
				const revealElement = Reveal.getRevealElement?.() || document.querySelector('.reveal');
				const slidesElement = Reveal.getSlidesElement?.() || document.querySelector('.slides');
				const viewportElement = Reveal.getViewportElement?.() || body;
				const presentSlide = document.querySelector('.slides section.present:not(.stack), .slides > section.present');
				const htmlRect = html.getBoundingClientRect();
				const bodyRect = body.getBoundingClientRect();
				const viewportRect = viewportElement?.getBoundingClientRect?.();
				const revealRect = revealElement?.getBoundingClientRect?.();
				const slidesRect = slidesElement?.getBoundingClientRect?.();
				const presentRect = presentSlide?.getBoundingClientRect?.();

				console.log('[directional layout]', reason, {
					deckMode,
					isMobileDeck,
					isScrollView: Reveal.isScrollView?.() || false,
					indices: getLogicalIndices(),
					window: {
						innerWidth: window.innerWidth,
						innerHeight: window.innerHeight,
					},
					visualViewport: window.visualViewport ? {
						width: window.visualViewport.width,
						height: window.visualViewport.height,
						offsetTop: window.visualViewport.offsetTop,
						offsetLeft: window.visualViewport.offsetLeft,
						scale: window.visualViewport.scale,
					} : null,
					units: {
						vh: measureViewportUnit('vh'),
						dvh: measureViewportUnit('dvh'),
						svh: measureViewportUnit('svh'),
						lvh: measureViewportUnit('lvh'),
						htmlVhVar: html.style.getPropertyValue('--vh') || null,
					},
					classes: {
						html: html.className,
						body: body.className,
						reveal: revealElement?.className || null,
					},
					htmlRect: {
						width: htmlRect.width,
						height: htmlRect.height,
					},
					bodyRect: {
						width: bodyRect.width,
						height: bodyRect.height,
					},
					viewportRect: viewportRect ? {
						top: viewportRect.top,
						left: viewportRect.left,
						width: viewportRect.width,
						height: viewportRect.height,
						bottom: viewportRect.bottom,
						right: viewportRect.right,
					} : null,
					revealRect: revealRect ? {
						top: revealRect.top,
						left: revealRect.left,
						width: revealRect.width,
						height: revealRect.height,
						bottom: revealRect.bottom,
						right: revealRect.right,
					} : null,
					slidesRect: slidesRect ? {
						top: slidesRect.top,
						left: slidesRect.left,
						width: slidesRect.width,
						height: slidesRect.height,
						bottom: slidesRect.bottom,
						right: slidesRect.right,
					} : null,
					presentRect: presentRect ? {
						top: presentRect.top,
						left: presentRect.left,
						width: presentRect.width,
						height: presentRect.height,
						bottom: presentRect.bottom,
						right: presentRect.right,
					} : null,
					overflowVsViewport: presentRect && viewportRect ? {
						top: presentRect.top - viewportRect.top,
						left: presentRect.left - viewportRect.left,
						right: presentRect.right - viewportRect.right,
						bottom: presentRect.bottom - viewportRect.bottom,
					} : null,
					overflowVsReveal: presentRect && revealRect ? {
						top: presentRect.top - revealRect.top,
						left: presentRect.left - revealRect.left,
						right: presentRect.right - revealRect.right,
						bottom: presentRect.bottom - revealRect.bottom,
					} : null,
				});
			}

			function handleMobileTouchStart(event) {
				if (!isMobileDeck || !event.touches || event.touches.length !== 1) {
					return;
				}

				const touch = event.touches[0];
				mobileSwipeState.startX = touch.clientX;
				mobileSwipeState.startY = touch.clientY;
				mobileSwipeState.active = true;
				mobileSwipeState.navigated = false;
			}

			function handleMobileTouchMove(event) {
				if (!isMobileDeck || !mobileSwipeState.active || mobileSwipeState.navigated || !event.touches || event.touches.length !== 1) {
					return;
				}

				const touch = event.touches[0];
				const deltaX = touch.clientX - mobileSwipeState.startX;
				const deltaY = touch.clientY - mobileSwipeState.startY;
				const absX = Math.abs(deltaX);
				const absY = Math.abs(deltaY);
				const swipeThreshold = 40;
				let direction = null;

				if (absX > swipeThreshold && absX > absY) {
					direction = deltaX < 0 ? 'right' : 'left';
				}
				else if (absY > swipeThreshold && absY > absX) {
					direction = deltaY < 0 ? 'down' : 'up';
				}

				if (!direction) {
					return;
				}

				const routes = getLogicalAvailableRoutes();
				if (!routes[direction]) {
					mobileSwipeState.navigated = true;
					event.preventDefault();
					return;
				}

				mobileSwipeState.navigated = true;
				navigateLogical(direction);
				event.preventDefault();
			}

			function handleMobileTouchEnd() {
				mobileSwipeState.active = false;
				mobileSwipeState.navigated = false;
			}

			function getOverviewMetrics() {
				const margin = 140;
				const slideSize = Reveal.getComputedSlideSize();
				const horizontalMargin = margin * 2;
				const verticalGap = slideSize.height * 0.2;
				const width = slideSize.width + horizontalMargin;
				const height = slideSize.height + verticalGap;

				return {
					width: Reveal.getConfig().rtl ? -width : width,
					height,
				};
			}

			function syncTransposedOverview() {
				// Overview behavior now lives in the transposed Reveal fork.
			}

			function installTransposedOverviewHooks() {
				// Overview behavior now lives in the transposed Reveal fork.
			}

				function handleTransposedArrowKeys(event) {
					const keyCode = event.keyCode;

				if (![37, 38, 39, 40, 72, 74, 75, 76].includes(keyCode)) {
					return;
				}

				if (event.defaultPrevented || event.ctrlKey || event.metaKey) {
					return;
				}

				const activeElement = document.activeElement;
				const activeElementIsEditable = activeElement && (
					activeElement.isContentEditable === true ||
					/input|textarea/i.test(activeElement.tagName || '')
				);

					if (activeElementIsEditable) {
						return;
					}

					if (Reveal.isOverlayOpen()) {
						return;
					}

					const indices = getLogicalIndices();

				event.preventDefault();
				event.stopImmediatePropagation();

				if (keyCode === 37 || keyCode === 72) {
					if (event.shiftKey) {
						slideLogical(0, indices.v, indices.f);
					}
					else {
						navigateLogical('left');
					}
				}
				else if (keyCode === 39 || keyCode === 76) {
					if (event.shiftKey) {
						slideLogical(getGroupLength(indices.v) - 1, indices.v, indices.f);
					}
					else {
						navigateLogical('right');
					}
				}
				else if (keyCode === 38 || keyCode === 75) {
					if (event.shiftKey) {
						slideLogical(indices.h, 0, indices.f);
					}
					else {
						navigateLogical('up');
					}
				}
				else if (keyCode === 40 || keyCode === 74) {
					if (event.shiftKey) {
						slideLogical(indices.h, groupSizes.length - 1, indices.f);
					}
					else {
						navigateLogical('down');
					}
				}
			}

			function bumpControl(direction) {
				const control = controlsRoot()?.querySelector(`.navigate-${direction}`);
				if (!control) {
					return;
				}

				control.classList.remove('bump');
				void control.offsetWidth;
				control.classList.add('bump');
			}

			function updateHelperTip() {
				if (!helperTip || isDualMode || isMobileDeck) {
					if (helperTip) {
						helperTip.hidden = true;
						helperTip.innerHTML = '';
					}
					return;
				}

				const indices = getLogicalIndices();
				const isOverviewMode = Reveal.getRevealElement().classList.contains('overview');
				const isTopLevelSlide = indices.h === 0;
				const isFirstSlide = indices.h === 0 && indices.v === 0;

				if (!isOverviewMode && isFirstSlide) {
					helperTip.hidden = true;
					helperTip.innerHTML = '';
					return;
				}

				helperTip.hidden = false;
				helperTip.innerHTML = isOverviewMode
					? `Press ${escTipIcon} to exit overview mode.`
					: isTopLevelSlide
						? 'Press Right to see project design samples.'
						: `Press ${escTipIcon} to enter overview mode.`;
			}

			function getNavigationDirection(previousSlide, currentSlide) {
				if (!previousSlide || !currentSlide) {
					return null;
				}

				const previous = getLogicalIndices(previousSlide);
				const current = getLogicalIndices(currentSlide);

				if (current.h !== previous.h) {
					return current.h > previous.h ? 'right' : 'left';
				}

				if (current.v !== previous.v) {
					return current.v > previous.v ? 'down' : 'up';
				}

				return null;
			}

			function getIndicesFromSlideElement(slideElement) {
				if (!slideElement) {
					return null;
				}

				return getLogicalIndices(slideElement);
			}

			function notifyParent(type, data = {}) {
				if (!isDualMode || window.parent === window) {
					return;
				}

				window.parent.postMessage({
					source: 'directional-deck',
					mode: isOverviewDeck ? 'overview' : 'normal',
					type,
					...data,
				}, '*');
			}

			function isOverviewMode() {
				return Reveal.getRevealElement().classList.contains('overview');
			}

			function preventOverviewPinch(event) {
				if (!isDualMode && isOverviewMode()) {
					event.preventDefault();
				}
			}

			function preventOverviewMultitouch(event) {
				if (!isDualMode && isOverviewMode() && event.touches && event.touches.length > 1) {
					event.preventDefault();
				}
			}

			function forwardParentPinch(type, data = {}) {
				if (!isDualMode) {
					return;
				}

				notifyParent('pinch', {
					pinchType: type,
					...data,
				});
			}

			function forwardParentSwipe(data = {}) {
				if (!isDualMode) {
					return;
				}

				notifyParent('wheel-nav', data);
			}

			if (isDualMode) {
				document.addEventListener('keydown', (event) => {
					if (event.key === 'Escape') {
						event.preventDefault();
						event.stopImmediatePropagation();
						notifyParent('toggle-request');
					}
				}, true);

				document.addEventListener('wheel', (event) => {
					if (event.ctrlKey) {
						event.preventDefault();
						event.stopImmediatePropagation();
						forwardParentPinch('wheel', {
							deltaY: event.deltaY,
						});
					}
					else {
						event.preventDefault();
						event.stopImmediatePropagation();
						forwardParentSwipe({
							deltaX: event.deltaX,
							deltaY: event.deltaY,
						});
					}
				}, { passive: false, capture: true });

				document.addEventListener('gesturestart', (event) => {
					event.preventDefault();
					forwardParentPinch('gesturestart', {
						scale: event.scale || 1,
					});
				}, { passive: false, capture: true });

				document.addEventListener('gesturechange', (event) => {
					event.preventDefault();
					forwardParentPinch('gesturechange', {
						scale: event.scale || 1,
					});
				}, { passive: false, capture: true });

				document.addEventListener('gestureend', (event) => {
					event.preventDefault();
					forwardParentPinch('gestureend', {
						scale: event.scale || 1,
					});
				}, { passive: false, capture: true });

				if (isOverviewDeck) {
					document.addEventListener('click', (event) => {
						if (!Reveal.getRevealElement().classList.contains('overview')) {
							return;
						}

						const slideElement = event.target.closest('.slides section');
						if (!slideElement || slideElement.classList.contains('stack')) {
							return;
						}

						const indices = getIndicesFromSlideElement(slideElement);
						if (!indices) {
							return;
						}

						const rect = slideElement.getBoundingClientRect();
						const clickCenter = {
							x: rect.left + (rect.width / 2),
							y: rect.top + (rect.height / 2),
						};

						event.preventDefault();
						event.stopImmediatePropagation();
						notifyParent('open-normal', {
							indices,
							clickCenter,
						});
					}, true);
				}
			}

			document.addEventListener('keydown', handleTransposedArrowKeys, true);
			document.addEventListener('gesturestart', preventOverviewPinch, { passive: false });
			document.addEventListener('gesturechange', preventOverviewPinch, { passive: false });
			document.addEventListener('gestureend', preventOverviewPinch, { passive: false });
			document.addEventListener('touchstart', preventOverviewMultitouch, { passive: false });
			document.addEventListener('touchmove', preventOverviewMultitouch, { passive: false });

			for (let groupIndex = 0; groupIndex < groupStarts.length; groupIndex += 1) {
				const start = groupStarts[groupIndex];
				const end = groupIndex + 1 < groupStarts.length ? groupStarts[groupIndex + 1] - 1 : slideCount;
				const group = document.createElement('section');

				group.appendChild(createSlide(start));

				for (let index = start + 1; index <= end; index += 1) {
					group.appendChild(createSlide(index));
				}

				slidesRoot.appendChild(group);
			}

			const keyboardBindings = {
				37: () => {},
				38: () => {},
				39: () => {},
				40: () => {},
				70: () => {},
				72: () => {},
				74: () => {},
				75: () => {},
				76: () => {},
				78: () => {},
				80: () => {},
			};

			Reveal.initialize(isDualMode ? {
				...revealCanvas,
				hash: false,
				controls: !isTouchDevice,
				help: !isTouchDevice,
				keyboard: keyboardBindings,
				keyboardCondition: allowNonPauseKeyboardInput,
				progress: false,
				center: false,
				overview: isOverviewDeck,
				zoom: !isOverviewDeck,
				transition: 'fade',
				transitionSpeed: 'fast',
				plugins: isOverviewDeck ? [] : [RevealZoom],
			} : isMobileDeck ? {
				...revealCanvas,
				hash: false,
				controls: false,
				help: false,
				keyboard: false,
				progress: false,
				center: false,
				overview: false,
				touch: false,
				zoom: false,
				transition: 'fade',
				transitionSpeed: 'fast',
				plugins: [],
			} : {
				...revealCanvas,
				hash: false,
				controls: !isTouchDevice,
				help: !isTouchDevice,
				keyboard: keyboardBindings,
				keyboardCondition: allowNonPauseKeyboardInput,
				progress: true,
				center: false,
				overview: true,
				zoom: true,
				transition: 'fade',
				transitionSpeed: 'fast',
				plugins: [RevealZoom],
				});

			const transposedDeck = new Proxy(Reveal, {
				get(target, property) {
					if (property === 'left') {
						return () => navigateLogical('left');
					}

					if (property === 'right') {
						return () => navigateLogical('right');
					}

					if (property === 'up') {
						return () => navigateLogical('up');
					}

					if (property === 'down') {
						return () => navigateLogical('down');
					}

					if (property === 'slide') {
						return (h, v, f) => slideLogical(h, v, f);
					}

					if (property === 'getIndices') {
						return (slideElement) => getLogicalIndices(slideElement);
					}

					if (property === 'availableRoutes') {
						return () => getLogicalAvailableRoutes();
					}

					const value = target[property];
					return typeof value === 'function' ? value.bind(target) : value;
				},
			});

			window.revealDeck = transposedDeck;
			installGroupedHashModel();
			installTransposedOverviewHooks();

			if (!isDualMode) {
				const revealElement = Reveal.getRevealElement();
				if (isMobileDeck) {
					revealElement.addEventListener('touchstart', handleMobileTouchStart, { passive: true });
					revealElement.addEventListener('touchmove', handleMobileTouchMove, { passive: false });
					revealElement.addEventListener('touchend', handleMobileTouchEnd, { passive: true });
					revealElement.addEventListener('touchcancel', handleMobileTouchEnd, { passive: true });
				}

				window.addEventListener('hashchange', () => {
					applyDeckHashForRuntime();
				});
			}

			if (isDualMode) {
				Reveal.on('ready', () => {
					if (isOverviewDeck) {
						requestAnimationFrame(() => {
							Reveal.toggleOverview();
							requestAnimationFrame(() => {
								notifyParent('ready', {
									indices: getLogicalIndices(),
								});
							});
						});
					} else {
						notifyParent('ready', {
							indices: getLogicalIndices(),
						});
					}
				});

				Reveal.on('slidechanged', (event) => {
					const logicalIndices = getLogicalIndices();
					notifyParent('slidechanged', {
						indexh: logicalIndices.h,
						indexv: logicalIndices.v,
						indexf: event.indexf || 0,
					});
				});

			}
			else {
				Reveal.on('ready', () => {
					const initialHash = parseDeckHashForRuntime();
					if (initialHash) {
						applyDeckHashForRuntime();
					}
					else {
						replaceDeckHashForRuntime(getLogicalIndices());
					}
				});

				Reveal.on('slidechanged', () => {
					replaceDeckHashForRuntime(getLogicalIndices());
				});
			}

			Reveal.on('ready', () => {
				updateHelperTip();
				syncTransposedOverview();
				requestAnimationFrame(() => {
					logDirectionalLayoutMetrics('ready');
				});
			});
			Reveal.on('overviewshown', () => {
				updateHelperTip();
				requestAnimationFrame(() => {
					syncTransposedOverview();
				});
			});
			Reveal.on('overviewhidden', () => {
				updateHelperTip();
			});
			Reveal.on('slidechanged', (event) => {
				const logicalIndices = getLogicalIndices();
				if (!isOverviewActive()) {
					logicalGroupProgress.set(logicalIndices.v, logicalIndices.h);
				}
				const direction = getNavigationDirection(event.previousSlide, event.currentSlide);
				if (direction) {
					bumpControl(direction);
				}

				updateHelperTip();
				syncTransposedOverview();
				requestAnimationFrame(() => {
					logDirectionalLayoutMetrics('slidechanged');
				});
			});

			window.addEventListener('resize', () => {
				requestAnimationFrame(() => {
					syncTransposedOverview();
					logDirectionalLayoutMetrics('resize');
				});
			});
			window.visualViewport?.addEventListener('resize', () => {
				requestAnimationFrame(() => {
					logDirectionalLayoutMetrics('visualViewport-resize');
				});
			});

			updateHelperTip();
		</script>
	</body>
</html>
