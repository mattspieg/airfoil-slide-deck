<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Trackpad Gesture Sequence</title>
		<style>
			:root {
				--trackpad-stroke: rgba(255, 255, 255, 0.34);
				--finger: #ffffff;
				--finger-outline: rgba(255, 255, 255, 0.72);
				--trail-core: rgba(255, 255, 255, 0.42);
				--trail-soft: rgba(255, 255, 255, 0);
				--duration: 10s;
				--ease: cubic-bezier(0.4, 0, 0.2, 1);
			}

			* { box-sizing: border-box; }
			html, body {
				height: 100%;
				margin: 0;
				background: transparent;
				font-family: Arial, Helvetica, sans-serif;
			}
			body {
				display: grid;
				place-items: center;
				padding: 10px;
			}
			.trackpad {
				position: relative;
				width: min(100%, 220px);
				aspect-ratio: 1.36;
				border: 4px solid var(--trackpad-stroke);
				border-radius: 28px;
				background: rgba(255, 255, 255, 0.01);
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 8px rgba(0, 0, 0, 0.16);
				overflow: hidden;
			}
			.finger {
				position: absolute;
				width: 22px;
				height: 22px;
				border-radius: 999px;
				border: 2px solid var(--finger-outline);
				background: transparent;
				opacity: 0;
				animation: finger-sequence var(--duration) linear infinite;
			}
			.finger::after {
				content: "";
				position: absolute;
				inset: 0;
				border-radius: inherit;
				background: var(--finger);
				opacity: 0;
				animation: fill-sequence var(--duration) linear infinite;
			}
			.finger::before {
				content: "";
				position: absolute;
				opacity: 0;
				animation: tail-sequence var(--duration) linear infinite;
			}

			.finger.a {
				left: 28%;
				top: 68%;
			}
			.finger.b {
				left: 70%;
				top: 18%;
			}

			@keyframes finger-sequence {
				0%, 5% {
					transform: translate(0, 0);
					opacity: 0;
				}
				8%, 16% {
					transform: translate(0, 0);
					opacity: 1;
				}
				24%, 28% {
					transform: translate(var(--x1, 0), var(--y1, 0));
					opacity: 1;
				}
				32%, 38% {
					transform: translate(var(--x2, 0), var(--y2, 0));
					opacity: 0;
				}
				100% {
					transform: translate(var(--x2, 0), var(--y2, 0));
					opacity: 0;
				}
			}

			.finger.a {
				--x1: 0px;
				--y1: -52px;
				--x2: 0px;
				--y2: -52px;
				animation-name: finger-a-sequence;
			}
			.finger.b {
				--x1: 0px;
				--y1: -52px;
				--x2: 0px;
				--y2: -52px;
				animation-name: finger-b-sequence;
			}

			@keyframes finger-a-sequence {
				0%, 5% { transform: translate(0, 0); opacity: 0; }
				8%, 16% { transform: translate(0, 0); opacity: 1; }
				24%, 28% { transform: translate(0, -52px); opacity: 1; }
				32%, 38% { transform: translate(0, -52px); opacity: 0; }

				39%, 44% { transform: translate(0, 0); opacity: 0; }
				47%, 54% { transform: translate(0, 0); opacity: 1; }
				62%, 68% { transform: translate(44px, -44px); opacity: 1; }
				72%, 78% { transform: translate(44px, -44px); opacity: 0; }

				79%, 84% { transform: translate(44px, -44px); opacity: 0; }
				87%, 94% { transform: translate(44px, -44px); opacity: 1; }
				100% { transform: translate(0, 0); opacity: 0; }
			}

			@keyframes finger-b-sequence {
				0%, 5% { transform: translate(0, 0); opacity: 0; }
				8%, 16% { transform: translate(0, 0); opacity: 1; }
				24%, 28% { transform: translate(0, -52px); opacity: 1; }
				32%, 38% { transform: translate(0, -52px); opacity: 0; }

				39%, 44% { transform: translate(0, 0); opacity: 0; }
				47%, 54% { transform: translate(0, 0); opacity: 1; }
				62%, 68% { transform: translate(-44px, 44px); opacity: 1; }
				72%, 78% { transform: translate(-44px, 44px); opacity: 0; }

				79%, 84% { transform: translate(-44px, 44px); opacity: 0; }
				87%, 94% { transform: translate(-44px, 44px); opacity: 1; }
				100% { transform: translate(0, 0); opacity: 0; }
			}

			@keyframes fill-sequence {
				0%, 9%, 30%, 48%, 70%, 88%, 100% { opacity: 0; }
				12%, 26%, 54%, 66%, 94% { opacity: 1; }
			}

			.finger.a::before {
				left: 50%;
				top: 50%;
				width: 22px;
				height: 56px;
				transform: translate(-50%, 0);
				border-radius: 0 0 999px 999px;
				background: linear-gradient(180deg, var(--trail-core) 0%, var(--trail-soft) 100%);
				filter: blur(4px);
				clip-path: inset(-8px 0 -8px 0 round 0 0 999px 999px);
				animation-name: tail-a-sequence;
			}

			.finger.b::before {
				left: 50%;
				top: 50%;
				width: 22px;
				height: 56px;
				transform: translate(-50%, 0);
				border-radius: 0 0 999px 999px;
				background: linear-gradient(180deg, var(--trail-core) 0%, var(--trail-soft) 100%);
				filter: blur(4px);
				clip-path: inset(-8px 0 -8px 0 round 0 0 999px 999px);
				animation-name: tail-b-sequence;
			}

			@keyframes tail-a-sequence {
				0%, 8% { opacity: 0; height: 0; transform: translate(-50%, 0) rotate(0deg); }
				16% { opacity: 0.2; height: 0; transform: translate(-50%, 0) rotate(0deg); }
				20% { opacity: 0.95; height: 38px; transform: translate(-50%, 0) rotate(0deg); }
				24% { opacity: 0.34; height: 14px; transform: translate(-50%, 0) rotate(0deg); }
				30%, 44% { opacity: 0; height: 0; transform: translate(-50%, 0) rotate(0deg); }

				54% { opacity: 0.2; height: 0; transform: translate(-50%, 0) rotate(45deg); }
				58% { opacity: 0.95; height: 34px; transform: translate(-50%, 0) rotate(45deg); }
				62% { opacity: 0.34; height: 12px; transform: translate(-50%, 0) rotate(45deg); }
				70%, 88% { opacity: 0; height: 0; transform: translate(-50%, 0) rotate(45deg); }

				94% { opacity: 0.2; width: 0; height: 22px; transform: translate(0, -50%) rotate(180deg); }
				97% { opacity: 0.95; width: 38px; height: 22px; transform: translate(0, -50%) rotate(180deg); }
				100% { opacity: 0.34; width: 14px; height: 22px; transform: translate(0, -50%) rotate(180deg); }
			}

			@keyframes tail-b-sequence {
				0%, 8% { opacity: 0; height: 0; transform: translate(-50%, 0) rotate(0deg); }
				16% { opacity: 0.2; height: 0; transform: translate(-50%, 0) rotate(0deg); }
				20% { opacity: 0.95; height: 38px; transform: translate(-50%, 0) rotate(0deg); }
				24% { opacity: 0.34; height: 14px; transform: translate(-50%, 0) rotate(0deg); }
				30%, 44% { opacity: 0; height: 0; transform: translate(-50%, 0) rotate(0deg); }

				54% { opacity: 0.2; height: 0; transform: translate(-50%, 0) rotate(225deg); }
				58% { opacity: 0.95; height: 34px; transform: translate(-50%, 0) rotate(225deg); }
				62% { opacity: 0.34; height: 12px; transform: translate(-50%, 0) rotate(225deg); }
				70%, 88% { opacity: 0; height: 0; transform: translate(-50%, 0) rotate(225deg); }

				94% { opacity: 0.2; width: 0; height: 22px; transform: translate(0, -50%) rotate(180deg); }
				97% { opacity: 0.95; width: 38px; height: 22px; transform: translate(0, -50%) rotate(180deg); }
				100% { opacity: 0.34; width: 14px; height: 22px; transform: translate(0, -50%) rotate(180deg); }
			}
		</style>
	</head>
	<body>
		<div class="trackpad" aria-label="Trackpad gesture sequence">
			<div class="finger a"></div>
			<div class="finger b"></div>
		</div>
	</body>
</html>
